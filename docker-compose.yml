version: '3.8'

services:
  db:
    image: postgres:15
    container_name: job_agent_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: job_agent_redis
    restart: always
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_agent_api
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-job_agent_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-job_agent_db}
      - REDIS_URL=redis://redis:6379/0
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_agent_worker
    restart: always
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-job_agent_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-job_agent_db}
      - REDIS_URL=redis://redis:6379/0
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: job_agent_beat
    restart: always
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost/api
    container_name: job_agent_frontend
    restart: always
    depends_on:
      - backend-api

  nginx:
    image: nginx:stable-alpine
    container_name: job_agent_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-api

volumes:
  postgres_data:
